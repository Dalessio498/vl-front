<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <title>Perfil Advogado</title>
</head>
<body>
    <main>
        <aside class="side-bar-father">
            <div class="side-bar-content">
                <div class="buttons-up-father">
                    <a href="profile.html"><img src="img/exit-icon.png" alt="Sair"></a>
                  

                </div>
                <div class="logo-father">
                    <img src="img/logo-white.png" alt="Logo VL">
                </div>
            </div>
        </aside>

        <section class="right-side-main">
            <div class="right-side">
                
                <div class="h1-box">
                    <div class="user-avatar-circle">
                        <img class="perfil" src="img/user-icon.png" alt="User Icon">
                    </div>
                    <h1>Olá, Rodrigo</h1>
                </div>

                <div class="form-box-father">
                    <div class="nav-buttons-top">
                        <button type="button" class="btn-action">Meus Processos</button>
                        <button type="button" class="btn-action">Meus clientes</button>
                    </div>
                    
                    <button type="button" class="btn-action btn-edit">Editar Minhas Informações</button>

                    <h2 class="info-title">Minhas Informações</h2>

                    <div class="info-grid">
                        <div class="input-group">
                            <label>Email:</label>
                            <div class="custom-input">rodrigomates25@gmail.com</div>
                        </div>
                        <div class="input-group">
                            <label>Telefone:</label>
                            <div class="custom-input">(11) 98457 1549</div>
                        </div>

                        <div class="input-group">
                            <label>Nome da Empresa:</label>
                            <div class="custom-input">CompanyJUS</div>
                        </div>
                        <div class="input-group">
                            <label>Cargo:</label>
                            <div class="custom-input">Criminalista</div>
                        </div>

                        <div class="input-group">
                            <label>Nº da OAB:</label>
                            <div class="custom-input">OAB/SP 123456</div>
                        </div>
                        <div class="input-group">
                            <label>CNPJ:</label>
                            <div class="custom-input">09.346.601/0001-25</div>
                        </div>
                    </div>
                </div>

            </div>
        </section>
    </main>
</body>
</html>
