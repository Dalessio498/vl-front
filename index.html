<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <!-- No seu HTML -->
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&display=swap" rel="stylesheet">
    <title>Cadastro Advogado</title>
</head>
<body>
    <main>
        <div class="side-bar-father">
            <div class="side-bar-content">
                <div class="buttons-up-father">
                    <a href="profile.html"><img src="img/exit-icon.png" alt="Exit Icon"></a>
                    <a href=""><img src="img/user-icon.png" alt="User Icon"></a>
                </div>
                <div class="logo-father">
                    <img src="img/logo-white.png" alt="">
                </div>
            </div>
        </div>
        <div class="right-side-main">
            <div class="right-side">
                <div class="h1-box">
                    <h1>CADASTRO DE ADVOGADO</h1>
                </div>
                <div class="form-box-father">
                    <div class="form-box-child">
                       
                        <form action="">
                         <div class="inputs">
                            <h2>Informações Gerais</h2>
                            <div class="input">
                            <label for="">Nome Completo:</label>
                            <input type="text" placeholder="Insira seu Nome Completo Aqui...">
                            </div>

                            <div class="input">
                            <label for="">Email:</label>
                            <input type="text" placeholder="Insira seu Email Aqui...">
                            </div>

                            <div class="input">
                            <label for="">Telefone:</label>
                            <input type="text" placeholder="Insira seu Telefone Aqui...">
                            </div>

                            <div class="input">
                            <label for="">CPF:</label>
                            <input type="text" placeholder="XXXXXXXXX-XX">
                            </div>

                             <div class="input">
                            <label for="">Data de Nacimento:</label>
                            <input type="date" placeholder="Insira sua Data Aqui...">
                            </div>

                            <h2>OAB</h2>
                            <div class="input">
                            <label for="">Numero Oficial</label>
                            <input type="text" placeholder="Insira o Numero da OAB...">
                            </div>
                            <div class="input">
                            <label for="">Unidade Federal:</label>
                            <input type="text" placeholder="Insira a Unidade Federal Ex: SP">
                            </div>

                            <h2>Endereço</h2>
                            <div class="input">
                            <label for="">Rua</label>
                            <input type="text" placeholder="Insira a sua Rua...">
                            </div>
                            <div class="input">
                            <label for="">Numero:</label>
                            <input type="option" placeholder="Insira o Numero da Residencia">
                            </div>
                             <div class="input">
                            <label for="">Bairro:</label>
                            <input type="option" placeholder="Insira seu Bairro...">
                            </div>
                             <div class="input">
                            <label for="">Estado:</label>
                            <input type="option" placeholder="Insira o seu Estado...">
                            </div>
                             <div class="input">
                            <label for="">CEP:</label>
                            <input type="option" placeholder="Insira o seu CEP... (xxxx-xx)">
                            </div>
                             <div class="input">
                            <label for="">Complemento:</label>
                            <input type="option" placeholder="Insira seu Complemento...">
                            </div>

                            <h2>Empresa</h2>
                            <div class="input">
                            <label for="">Nome da Empresa:</label>
                            <input type="text" placeholder="Insira o Nome da Empresa...">
                            </div>
                            <div class="input">
                            <label for="">CNPJ:</label>
                            <input type="option" placeholder="Insira o CNPJ da empresa">
                            </div>

                            <button type="button" onclick="" class="button-form">Salvar</button>
                        </div>
                        </form>
                        
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
